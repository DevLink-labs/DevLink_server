# 운영(EC2) 전용 compose. CI/CD가 /opt/devlink/docker-compose.prod.yml 로 복사하고 같은 폴더의 .env 를 읽는다.
# 앱 이미지는 GHCR에서 받으며 EC2에서는 빌드하지 않는다. DB 포트는 외부에 노출하지 않는다.
# 외부 노출은 caddy(80, 443)만 한다. app 의 8080 은 compose 네트워크 안에서만 접근한다.
# postgres 는 EC2 루프백(127.0.0.1)에만 바인딩해 SSH 터널로만 DB 클라이언트가 접속한다.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: devlink
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/ssafy-urayaha/devlink-server:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/devlink
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://devlinkfrontend.vercel.app,https://devlink.ai.kr}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS}
      TASK_MESSAGE_CURSOR_SECRET: ${TASK_MESSAGE_CURSOR_SECRET:-}
      WORKING_FILES_REQUIRE_IF_MATCH: "${WORKING_FILES_REQUIRE_IF_MATCH:-false}"
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      TEAM_CONTEXT_INFERENCE_BASE_URL: ${TEAM_CONTEXT_INFERENCE_BASE_URL:-https://api.upstage.ai/v1}
      TEAM_CONTEXT_INFERENCE_MODEL: ${TEAM_CONTEXT_INFERENCE_MODEL:-solar-pro4}
      TEAM_CONTEXT_INFERENCE_OPENROUTER_GUARD: ${TEAM_CONTEXT_INFERENCE_OPENROUTER_GUARD:-false}
      DECISION_MODEL_ENABLED: "${DECISION_MODEL_ENABLED:-false}"
      DECISION_MODEL_API_KEY: ${DECISION_MODEL_API_KEY:-}
      DECISION_MODEL_REQUIRE_API_KEY: "${DECISION_MODEL_REQUIRE_API_KEY:-true}"
      DECISION_MODEL_URL: ${DECISION_MODEL_URL:-https://openrouter.ai/api/alpha/decisions}
      DECISION_MODEL_MODEL: ${DECISION_MODEL_MODEL:-google/gemini-decision-1}
      DECISION_MODEL_TIMEOUT_MS: "${DECISION_MODEL_TIMEOUT_MS:-1500}"
      DECISION_MODEL_THRESHOLD: "${DECISION_MODEL_THRESHOLD:-0.7}"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
