services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: devlink
            POSTGRES_USER: ${DB_USERNAME:-devlink}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-devlink}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 5s
            timeout: 3s
            retries: 10
    app:
        build: .
        environment:
            SPRING_PROFILES_ACTIVE: local
            DB_URL: jdbc:postgresql://postgres:5432/devlink
            DB_USERNAME: ${DB_USERNAME:-devlink}
            DB_PASSWORD: ${DB_PASSWORD:-devlink}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://devlinkfrontend.vercel.app,https://devlink.ai.kr}
            WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:3000}
            TASK_MESSAGE_CURSOR_SECRET: ${TASK_MESSAGE_CURSOR_SECRET:-}
            # 팀·파트 Context 추론용. 비어 있으면 구조 신호 전용으로 동작한다.
            UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
            # OpenRouter·vLLM 등 다른 OpenAI 호환 엔드포인트로 바꿀 때만 지정한다.
            TEAM_CONTEXT_INFERENCE_BASE_URL: ${TEAM_CONTEXT_INFERENCE_BASE_URL:-https://api.upstage.ai/v1}
            TEAM_CONTEXT_INFERENCE_MODEL: ${TEAM_CONTEXT_INFERENCE_MODEL:-solar-pro4}
            TEAM_CONTEXT_INFERENCE_OPENROUTER_GUARD: ${TEAM_CONTEXT_INFERENCE_OPENROUTER_GUARD:-false}
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
volumes:
    postgres_data:
