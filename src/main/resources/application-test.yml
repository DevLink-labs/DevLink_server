# Datasource connection details are supplied by Testcontainers @ServiceConnection.
spring:
    datasource:
        url: ""
devlink:
    task-message-sync:
        # 테스트 전용 고정 키이며 운영 환경에서는 별도의 무작위 키를 설정한다.
        cursor-secret: test-only-task-message-cursor-secret-2026
    outbox:
        # 기존 저장 테스트는 PENDING을 검증하므로 자동 발행 대신 테스트가 명시적으로 실행한다.
        publisher-enabled: false
    team-context:
        # 갱신기는 테스트가 명시적으로 실행한다. 추론은 구조 신호 전용으로 둔다.
        enabled: false
        inference:
            base-url: ""
            api-key: ""
            legacy-api-key: ""
            model: ""
    websocket:
        allowed-origins: http://localhost:3000
