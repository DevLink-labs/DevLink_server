server:
    # Caddy 리버스 프록시 뒤에서 X-Forwarded-Proto/For/Host 를 신뢰해 스킴·클라이언트 주소를 판단한다.
    forward-headers-strategy: framework
    servlet:
        session:
            cookie:
                secure: true
                same-site: none
spring:
    config:
        import: optional:file:./.env[.properties]
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    flyway:
        clean-disabled: true
devlink:
    websocket:
        allowed-origins: ${WS_ALLOWED_ORIGINS}
