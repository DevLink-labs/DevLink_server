server:
    port: 8080
    servlet:
        session:
            timeout: 30m
            cookie:
                http-only: true
                same-site: lax
devlink:
    working-files:
        require-if-match: ${WORKING_FILES_REQUIRE_IF_MATCH:false}
    task-message-sync:
        cursor-secret: ${TASK_MESSAGE_CURSOR_SECRET:}
    recommendation:
        decision-model:
            # 담당 Agent 추천의 역할 태그 판정 보강(Gemini Decisions API). 기본은 꺼짐이고, 켜도 키가 없으면 호출하지 않는다.
            # 켜면 질문과 팀원의 명시 역할 태그가 외부 API로 전송된다. 호출 실패·시간 초과 시 기존 토큰 일치만으로 계산한다.
            enabled: ${DECISION_MODEL_ENABLED:false}
            api-key: ${DECISION_MODEL_API_KEY:}
            base-url: ${DECISION_MODEL_BASE_URL:https://generativelanguage.googleapis.com}
            model: ${DECISION_MODEL_MODEL:gemini-decision-1}
            # 모델이 시간 초과하면 이 값만큼 응답이 늦어진다. 브로커의 중앙 호출 제한이 5초이므로 최대 2000이다.
            timeout-ms: ${DECISION_MODEL_TIMEOUT_MS:1500}
            # 모델의 일치 확률이 이 값 이상이면 태그 일치로 본다.
            threshold: ${DECISION_MODEL_THRESHOLD:0.7}
    outbox:
        publisher-enabled: true
        poll-interval-ms: 1000
        batch-size: 20
        lease-ms: 30000
        retry-base-ms: 1000
        retry-max-ms: 60000
        max-attempts: 5
    team-context:
        # 팀·파트 간 Context 요약. team-context Outbox를 소비해 파트 쌍별 요약을 증분 갱신한다.
        enabled: true
        poll-interval-ms: 1000
        max-input-chars: 6000
        max-items: 20
        prompt-version: v1
        inference:
            # OpenAI 호환 chat/completions. 기본은 Upstage Solar이며 키가 없으면 구조 신호 전용으로 동작한다.
            # 자체 vLLM으로 바꾸려면 base-url·model을 바꾸고 require-api-key를 false로 둔다.
            base-url: ${TEAM_CONTEXT_INFERENCE_BASE_URL:https://api.upstage.ai/v1}
            api-key: ${UPSTAGE_API_KEY:}
            require-api-key: ${TEAM_CONTEXT_INFERENCE_REQUIRE_API_KEY:true}
            model: ${TEAM_CONTEXT_INFERENCE_MODEL:solar-pro4}
            timeout-ms: 60000
            max-output-tokens: 2000
            # OpenRouter를 쓸 때만 true. 스키마 미지원·학습 수집 제공자로의 라우팅을 막는다.
            openrouter-provider-guard: ${TEAM_CONTEXT_INFERENCE_OPENROUTER_GUARD:false}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:https://devlinkfrontend.vercel.app,https://devlink.ai.kr}
    broker:
        heartbeat-timeout-ms: 40000
        heartbeat-check-interval-ms: 1000
        # ACK 대기는 실제 소켓 전송 직전부터 최대 5초이며, 100ms 간격으로 만료를 확인한다.
        ack-timeout-ms: 5000
        ack-check-interval-ms: 100
spring:
    application:
        name: devlink-server
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/devlink}
        username: ${DB_USERNAME:devlink}
        password: ${DB_PASSWORD:devlink}
    jackson:
        time-zone: UTC
        serialization:
            write-dates-as-timestamps: false
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate.query.in_clause_parameter_padding: true
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: false
        validate-on-migrate: true
management:
    endpoints:
        web:
            exposure:
                include: health,info
